server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

    # Augmente la taille max pour l'upload des chapitres et archives (1GB)
    client_max_body_size 1024M;
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Servir les fichiers de storage directement sans passer par PHP
    location ^~ /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Routes et scripts Livewire (dynamiques et statiques)
    location ^~ /livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets Livewire publiés
    location ^~ /vendor/livewire/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets statiques (Vite, images, fonts)
    location ~* \.(jpg|jpeg|gif|png|webp|svg|css|js|ico|woff|woff2|ttf)$ {
        try_files $uri $uri/ /index.php?$query_string;
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 600;
        fastcgi_send_timeout 600;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
